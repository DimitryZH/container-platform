[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-platform"
version = "0.1.0"
description = "Release validation with optional public Docker Hub metadata verification"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.scripts]
container-release = "container_platform.cli:main"
container-compose = "container_platform.compose:main"
container-smoke = "container_platform.smoke:main"

[tool.setuptools]
packages = ["container_platform", "container_platform.schemas", "container_platform.profiles"]

[tool.setuptools.package-dir]
container_platform = "src/container_platform"
"container_platform.schemas" = "schemas"

[tool.setuptools.package-data]
"container_platform.schemas" = ["release-v1.schema.json"]
"container_platform.profiles" = ["*.json"]
