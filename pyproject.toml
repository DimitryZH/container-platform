[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-platform"
version = "0.1.0"
description = "Offline validation of Container Platform release candidates"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.scripts]
container-release = "container_platform.cli:main"

[tool.setuptools]
packages = ["container_platform", "container_platform.schemas"]

[tool.setuptools.package-dir]
container_platform = "src/container_platform"
"container_platform.schemas" = "schemas"

[tool.setuptools.package-data]
"container_platform.schemas" = ["release-v1.schema.json"]
